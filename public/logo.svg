<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <linearGradient id="wand" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E9D5FF"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- Magic wand -->
  <line x1="155" y1="357" x2="320" y2="155" stroke="url(#wand)" stroke-width="28" stroke-linecap="round"/>
  <!-- Wand tip glow -->
  <circle cx="320" cy="155" r="20" fill="#FDE68A" filter="url(#glow)" opacity="0.9"/>
  <!-- Sparkle 1 - top right -->
  <path d="M370 100 L375 85 L380 100 L395 105 L380 110 L375 125 L370 110 L355 105 Z" fill="#FDE68A" filter="url(#glow)"/>
  <!-- Sparkle 2 - right -->
  <path d="M390 170 L393 162 L396 170 L404 173 L396 176 L393 184 L390 176 L382 173 Z" fill="#FBBF24" filter="url(#glow)"/>
  <!-- Sparkle 3 - top -->
  <path d="M310 90 L313 82 L316 90 L324 93 L316 96 L313 104 L310 96 L302 93 Z" fill="#FBBF24" filter="url(#glow)"/>
  <!-- Sparkle 4 - small -->
  <path d="M350 130 L352 125 L354 130 L359 132 L354 134 L352 139 L350 134 L345 132 Z" fill="#FDE68A" filter="url(#glow)"/>
  <!-- Brain/AI node circles -->
  <circle cx="230" cy="260" r="18" fill="none" stroke="#E9D5FF" stroke-width="3" opacity="0.7"/>
  <circle cx="280" cy="230" r="14" fill="none" stroke="#E9D5FF" stroke-width="3" opacity="0.6"/>
  <circle cx="260" cy="300" r="12" fill="none" stroke="#E9D5FF" stroke-width="3" opacity="0.5"/>
  <!-- AI connection lines -->
  <line x1="245" y1="252" x2="268" y2="238" stroke="#E9D5FF" stroke-width="2" opacity="0.4"/>
  <line x1="240" y1="275" x2="252" y2="292" stroke="#E9D5FF" stroke-width="2" opacity="0.4"/>
  <line x1="290" y1="228" x2="268" y2="294" stroke="#E9D5FF" stroke-width="2" opacity="0.3"/>
  <!-- Node dots -->
  <circle cx="230" cy="260" r="5" fill="#E9D5FF" opacity="0.8"/>
  <circle cx="280" cy="230" r="4" fill="#E9D5FF" opacity="0.7"/>
  <circle cx="260" cy="300" r="3.5" fill="#E9D5FF" opacity="0.6"/>
</svg>
