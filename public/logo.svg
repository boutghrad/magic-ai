<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0E7FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Large magic wand -->
  <g filter="url(#glow)">
    <!-- Wand body -->
    <rect x="185" y="230" width="180" height="14" rx="7" fill="url(#spark)" transform="rotate(-45 275 237)" opacity="0.95"/>
    <!-- Wand tip -->
    <circle cx="400" cy="115" r="12" fill="url(#star)" filter="url(#softGlow)"/>
  </g>

  <!-- Star burst at wand tip -->
  <g filter="url(#softGlow)">
    <polygon points="400,70 405,100 435,105 405,110 400,140 395,110 365,105 395,100" fill="url(#star)" opacity="0.9"/>
    <polygon points="430,80 432,98 450,100 432,102 430,120 428,102 410,100 428,98" fill="url(#star)" opacity="0.7"/>
    <polygon points="370,78 372,93 387,95 372,97 370,112 368,97 353,95 368,93" fill="url(#star)" opacity="0.6"/>
  </g>

  <!-- Sparkle dots around the star -->
  <circle cx="440" cy="72" r="4" fill="white" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="360" cy="70" r="3" fill="white" opacity="0.7" filter="url(#softGlow)"/>
  <circle cx="425" cy="135" r="3.5" fill="white" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="370" cy="130" r="3" fill="white" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="450" cy="105" r="2.5" fill="white" opacity="0.7" filter="url(#softGlow)"/>
  <circle cx="355" cy="100" r="2" fill="white" opacity="0.6" filter="url(#softGlow)"/>

  <!-- AI text / brain circuit lines -->
  <g opacity="0.3" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none">
    <path d="M120 340 Q140 320 160 340 Q180 360 200 340"/>
    <path d="M130 370 Q150 350 170 370 Q190 390 210 370"/>
    <circle cx="120" cy="340" r="4" fill="rgba(255,255,255,0.4)"/>
    <circle cx="200" cy="340" r="4" fill="rgba(255,255,255,0.4)"/>
    <circle cx="130" cy="370" r="4" fill="rgba(255,255,255,0.4)"/>
    <circle cx="210" cy="370" r="4" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- "AI" text -->
  <text x="256" y="410" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" opacity="0.95" letter-spacing="-2">AI</text>

  <!-- Decorative bottom line -->
  <rect x="196" y="430" width="120" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
</svg>
